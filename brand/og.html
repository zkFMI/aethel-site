<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aethel og</title>
<link rel="stylesheet" href="../public/style.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.og{position:relative;width:1200px;height:630px;padding:64px 80px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,var(--bg),var(--bg-2))}
.og .wm{font-size:56px}
.og h1{font-size:72px;max-width:640px;margin-top:20px}
.og .eyebrow{margin:0 0 16px}
.og .foot{font-family:var(--mono);font-size:18px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.og .bars{position:absolute;right:80px;top:150px;display:flex;align-items:flex-end;gap:22px;height:300px}
.og .bars i{display:block;width:48px;background:var(--blue);border-radius:8px;opacity:.9}
.og .bars b{display:block;width:70px;height:300px;background:var(--ink);border-radius:12px;margin-left:18px}
</style></head>
<body><div class="og">
<div><p class="eyebrow">Aethel · payment-stream receivables · by æmeth</p><h1>The payment stream is the receivable.</h1></div>
<div class="bars"><i style="height:140px"></i><i style="height:190px"></i><i style="height:120px"></i><i style="height:230px"></i><i style="height:170px"></i><i style="height:210px"></i><b></b></div>
<div class="foot">aethel.fi · zkfmi.com</div>
</div></body></html>
